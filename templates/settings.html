<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações - MindDesk</title>
    <link rel="stylesheet" href="settings.css">
    <link rel="stylesheet" href="{{ url_for('static', path='css/settings.css') }}">
</head>

<body>
    <!-- HEADER GLOBAL -->
    <header class="page-header">
        <button class="btn-back" onclick="window.location.href='minddesk.html'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </button>
        <h1 class="page-title">Configurações</h1>
        <div class="header-spacer"></div>
    </header>

    <!-- CONTAINER DO CONTEÚDO -->
    <div class="settings-container">
        <main class="settings-content">
            <!-- Perfil Section -->
            <section class="settings-section">
                <h2 class="section-title">Perfil</h2>
                <div class="setting-item">
                    <div class="setting-info">
                        <label for="profileName" class="setting-label">Nome do usuário</label>
                        <p class="setting-description">Como você gostaria de ser chamado</p>
                    </div>
                    <div class="setting-control">
                        <input type="text" id="profileName" class="input-text" placeholder="Digite seu nome"
                            value="usuario">
                        <button class="btn-save" id="saveNameBtn">Salvar</button>
                    </div>
                </div>
            </section>

            <!-- Aparência Section -->
            <section class="settings-section">
                <h2 class="section-title">Aparência</h2>
                <div class="setting-item">
                    <div class="setting-info">
                        <label class="setting-label">Tema</label>
                        <p class="setting-description">Escolha entre tema claro ou escuro</p>
                    </div>
                    <div class="setting-control">
                        <div class="theme-toggle">
                            <button class="theme-btn active" data-theme="light">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <circle cx="12" cy="12" r="5"></circle>
                                    <line x1="12" y1="1" x2="12" y2="3"></line>
                                    <line x1="12" y1="21" x2="12" y2="23"></line>
                                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                                    <line x1="1" y1="12" x2="3" y2="12"></line>
                                    <line x1="21" y1="12" x2="23" y2="12"></line>
                                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                                </svg>
                                Claro
                            </button>
                            <button class="theme-btn" data-theme="dark">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                                </svg>
                                Escuro
                            </button>
                            <button class="theme-btn" data-theme="auto">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                                    <line x1="8" y1="21" x2="16" y2="21"></line>
                                    <line x1="12" y1="17" x2="12" y2="21"></line>
                                </svg>
                                Auto
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Chat Section -->
            <section class="settings-section">
                <h2 class="section-title">Chat</h2>
                <div class="setting-item">
                    <div class="setting-info">
                        <label class="setting-label">Histórico de conversas</label>
                        <p class="setting-description">Apagar todas as conversas salvas</p>
                    </div>
                    <div class="setting-control">
                        <button class="btn-danger" id="clearHistoryBtn">Limpar histórico</button>
                    </div>
                </div>
            </section>

            <!-- Conta Section -->
            <section class="settings-section">
                <h2 class="section-title">Conta</h2>
                <div class="setting-item">
                    <div class="setting-info">
                        <label class="setting-label">Sessão</label>
                        <p class="setting-description">Sair da sua conta</p>
                    </div>
                    <div class="setting-control">
                        <button class="btn-logout" id="logoutBtn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                                <polyline points="16 17 21 12 16 7"></polyline>
                                <line x1="21" y1="12" x2="9" y2="12"></line>
                            </svg>
                            Sair
                        </button>
                    </div>
                </div>
            </section>
        </main>
    </div>


    <script src="{{ url_for('static', path='js/settings.js') }}"></script>
</body>

</html>
