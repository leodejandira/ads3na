<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="{{ url_for('static', path='css/upload.css') }}">
    <title>MindDesk - Upload de Arquivos</title>
</head>

<body>
    <div id="authCheck" class="loading">Verificando autenticação...</div>

    <div class="container" style="display:none;">
        <div class="button-row">
            <button class="btn btn-back action-btn" onclick="goBackToHome()">
                Voltar
            </button>
        </div>

        <!-- Upload Section -->
        <div class="upload-container">
            <h1>Upload de PDF</h1>

            <div class="drop-zone" id="dropZone">
                <i class='bx bx-cloud-upload'></i>
                <p class="drop-text">Arraste e solte seu PDF aqui</p>
                <p class="drop-subtext">ou clique para selecionar</p>
                <button type="button" class="select-btn">Selecionar PDF</button>
                <input type="file" id="fileInput" accept=".pdf" hidden>
            </div>

            <div class="form-group">
                <label for="displayName">Nome de exibição (opcional)</label>
                <input type="text" id="displayName" class="form-input" placeholder="Digite um nome para exibir">
            </div>

            <div class="selected-files" id="selectedFiles" style="display: none;">
                <h3>Arquivo Selecionado</h3>
                <div id="fileList"></div>
                <button type="button" class="upload-btn" id="uploadBtn">Fazer Upload</button>
            </div>

            <div id="message" class="message"></div>
        </div>
        

        <!-- Processing Info -->
        <div id="processingInfo" class="processing-info" style="display: none;"></div>

        <div class="pdf-list-container">
            <h2>Arquivos Disponíveis</h2>
            <div class="table-responsive">
                <table class="pdf-table">
                    <thead>
                        <tr>
                            <th>Nome do Arquivo</th>
                            <th>Data de Envio</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="pdfTableBody">
                        </tbody>
                </table>
                <p id="emptyTableMessage" style="text-align: center; color: #64748b; padding: 20px; display: none;">
                    Nenhum PDF encontrado.
                </p>
            </div>
        </div>

    </div> <script src="{{ url_for('static', path='js/upload.js') }}"></script>
</body>
</html>
