<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindDesk - Upload de Arquivos</title>

    <!-- Ícones (Boxicons) -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/static/upload-styles.css">
</head>
<body>
    <main class="container">
        <!-- Upload Section -->
        <div class="upload-container">
            <h1>Upload de Arquivos</h1>

            <div class="drop-zone" id="dropZone">
                <i class='bx bx-cloud-upload'></i>
                <p class="drop-text">Arraste e solte seus arquivos aqui</p>
                <p class="drop-subtext">ou clique para selecionar</p>
                <button type="button" class="select-btn">Selecionar Arquivos</button>
                <input type="file" id="fileInput" multiple hidden>
            </div>

            <div class="selected-files" id="selectedFiles" style="display: none;">
                <h3>Arquivos Selecionados (<span id="fileCount">0</span>)</h3>
                <div id="fileList"></div>
                <button type="button" class="upload-btn" id="uploadBtn">Fazer Upload</button>
            </div>
        </div>

        <!-- Table Section -->
        <div class="table-container">
            <div class="table-header">
                <h2>Arquivos Salvos</h2>
                <div class="search-box">
                    <i class='bx bx-search'></i>
                    <input type="text" id="searchInput" placeholder="Buscar arquivos...">
                </div>
            </div>

            <div class="table-wrapper">
                <table class="files-table">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Tamanho</th>
                            <th>Enviado por</th>
                            <th>Data</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Arquivos carregados dinamicamente via JS -->
                    </tbody>
                </table>
            </div>

            <div class="table-footer">
                <p>Total: <span id="totalFiles">0</span> arquivo(s)</p>
                
            </div>
        </div>
    </main>

    <!-- Script -->
    <script src="/static/upload-script.js"></script>
</body>
</html>
