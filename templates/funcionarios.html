<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Funcionários - Sistema de Gestão</title>
    <meta name="description" content="Sistema de gerenciamento de funcionários - Registrar e gerenciar usuários">
    <link rel="stylesheet" href="{{ url_for('static', path='css/funcionarios.css') }}">
</head>

<body>
    <div id="authCheck" class="loading">Verificando autenticação...</div>

    <div id="mainContent" class="container" style="display:none;">
        <div class="content">
            <div class="button-row">
                <button class="btn btn-back action-btn" onclick="window.location.href='/gerente'">
                    Voltar
                </button>
                <button id="btn-open-modal" class="btn btn-primary action-btn">
                    Cadastrar Funcionário
                </button>
            </div>

            <!-- Mensagem de feedback -->
            <div id="message" class="message"></div>

            <!-- Lista de Funcionários -->
            <section class="employees-section">
                <h2 class="section-title">Funcionários Existentes</h2>

                <div class="table-container">
                    <table class="employees-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>E-mail</th>
                                <th>Role</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="usersList">
                            <!-- Os usuários serão carregados aqui via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>

    <!-- ========== MODAL ========== -->
    <div id="modal" class="modal-overlay">
        <div class="modal-content">
            <h2 class="modal-title">Cadastrar Funcionário</h2>
            <form id="registerForm" class="modal-form">
                <input type="text" id="name" name="name" class="form-input" placeholder="Nome" required>
                <input type="email" id="email" name="email" class="form-input" placeholder="usergen@example.com" required>
                <input type="password" id="senha" name="senha" class="form-input" placeholder="••••••••" required>

                <select id="role" name="role" class="form-select" required>
                    <option value="usuario">Usuário</option>
                    <option value="gerente">Gerente</option>
                </select>

                <button type="submit" class="btn btn-primary" id="submitBtn">Registrar</button>
            </form>

            <button id="btn-close-modal" class="btn btn-back" style="margin-top: 20px;">
                Fechar
            </button>
        </div>
    </div>

    <script src="{{ url_for('static', path='js/funcionarios.js') }}"></script>
</body>
</html>
