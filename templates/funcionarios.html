<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Funcionários - MindDesk</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/funcionarios.css') }}">
</head>
<body>
    <div class="container">
        <div class="content">

            <!-- Formulário de Registro -->
            <section class="register-section">
                <h1 class="section-title">Registrar Novo Funcionário</h1>
                
                <form class="register-form" id="registerForm">
                    <input type="text" id="name" class="form-input" placeholder="Nome" required>
                    <input type="email" id="email" class="form-input" placeholder="usergen@example.com" required>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                    
                    <select id="role" class="form-select" required>
                        <option value="usuario">Usuário</option>
                        <option value="gerente">Gerente</option>
                    </select>
                    
                    <button type="submit" class="btn btn-primary">Registrar</button>
                </form>
            </section>

            <!-- Lista de Funcionários -->
            <section class="employees-section">
                <h2 class="section-title">Funcionários Existentes</h2>
                
                <div class="table-container">
                    <table class="employees-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>E-mail</th>
                                <th>Role</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="employeesTableBody">
                            <!-- preenchido via JS -->
                        </tbody>
                    </table>
                </div>
                
                <button class="btn btn-back" id="backBtn">Voltar</button>
            </section>
        </div>
    </div>

    <script src="{{ url_for('static', path='js/funcionarios.js') }}"></script>
</body>
</html>
