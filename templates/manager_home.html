<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerente</title>
    <style>
        body { margin: 20px; font-family: Arial; }
        .loading { text-align: center; padding: 20px; }
        .content { text-align: center; }
        button { 
            display: block; 
            margin: 10px auto; 
            padding: 10px 20px; 
            width: 200px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="loading" class="loading">Verificando autenticação...</div>

    <div id="content" class="content" style="display:none;">
        <h1>GERENTE</h1>
        <p>sou patrão não funcionário meu estilo de vida é foda...</p>
        
        <button onclick="window.location.href='/upload'">Upload de PDF</button>
        <button onclick="window.location.href='/funcionarios'">Gerenciar Funcionários</button>
        <button onclick="window.location.href='#'">Chat</button>
        <button onclick="logout()">Sair</button>
    </div>

    <script>
        const token = localStorage.getItem('access_token');
        const loading = document.getElementById('loading');
        const content = document.getElementById('content');

        if (!token) {
            window.location.href = '/login';
        } else {
            fetch('/rota-gerente', {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            })
            .then(response => {
                loading.style.display = 'none';
                if (response.ok) {
                    content.style.display = 'block';
                } else {
                    localStorage.removeItem('access_token');
                    window.location.href = '/login';
                }
            })
            .catch(error => {
                console.error('Erro:', error);
                window.location.href = '/login';
            });
        }
        
        function logout() {
            localStorage.removeItem('access_token');
            window.location.href = '/';
        }
    </script>
</body>
</html>
