<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Funcionários - Sistema de Gestão</title>
    <meta name="description" content="Sistema de gerenciamento de funcionários - Registrar e gerenciar usuários">
    <link rel="stylesheet" href="funcionarios.css">
</head>
<body>
    <div class="container">
        <div class="content">
            <!-- Formulário de Registro -->
            <section class="register-section">
                <h1 class="section-title">Registrar Novo Funcionário</h1>
                
                <form class="register-form">
                    <input 
                        type="text" 
                        class="form-input" 
                        placeholder="Nome"
                        required
                    >
                    
                    <input 
                        type="email" 
                        class="form-input" 
                        placeholder="usergen@example.com"
                        required
                    >
                    
                    <input 
                        type="password" 
                        class="form-input" 
                        placeholder="••••••••"
                        required
                    >
                    
                    <select class="form-select" required>
                        <option value="usuario">Usuário</option>
                        <option value="gerente">Gerente</option>
                    </select>
                    
                    <button type="submit" class="btn btn-primary">Registrar</button>
                </form>
            </section>

            <!-- Lista de Funcionários -->
            <section class="employees-section">
                <h2 class="section-title">Funcionários Existentes</h2>
                
                <div class="table-container">
                    <table class="employees-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>E-mail</th>
                                <th>Role</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>2</td>
                                <td>Frank (Gerente)</td>
                                <td>frank@hotmail.com</td>
                                <td>gerente</td>
                                <td>
                                    <button class="btn btn-delete">Deletar</button>
                                </td>
                            </tr>
                            <tr>
                                <td>3</td>
                                <td>string</td>
                                <td>usergen@example.com</td>
                                <td>gerente</td>
                                <td>
                                    <button class="btn btn-delete">Deletar</button>
                                </td>
                            </tr>
                            <tr>
                                <td>5</td>
                                <td>peao</td>
                                <td>funcionario@hotmail.com</td>
                                <td>usuário</td>
                                <td>
                                    <button class="btn btn-delete">Deletar</button>
                                </td>
                            </tr>
                            <tr>
                                <td>6</td>
                                <td>gerente</td>
                                <td>gerente@hotmail.com</td>
                                <td>gerente</td>
                                <td>
                                    <button class="btn btn-delete">Deletar</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <button class="btn btn-back">Voltar</button>
            </section>
        </div>
    </div>
</body>
</html>
